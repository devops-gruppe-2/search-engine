# Nginx på serveren: HTTPS for whoknows-gruppe2.dk foran Go-appen.
# nginx.conf (uden .prod) bruges stadig lokalt og i CI med compose.yml.

events { }

http {
    # Vis ikke Nginx-versionen i svarene
    server_tokens off;

    # Fælles indstillinger når Nginx sender en request videre til Go-appen
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Kald direkte på IP-adressen (fx simulatoren via repositories.py) virker
    # stadig over http, fordi certifikatet kun gælder for domænet.
    server {
        listen 80 default_server;

        include /etc/nginx/security-headers.conf;

        location / {
            proxy_pass http://backend:8080;
        }
    }

    # http://whoknows-gruppe2.dk sendes videre til https
    server {
        listen 80;
        server_name whoknows-gruppe2.dk;

        # Let's Encrypt lægger en fil her, når certifikatet fornyes,
        # så fornyelsen virker uden at stoppe Nginx
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name whoknows-gruppe2.dk;

        ssl_certificate /etc/letsencrypt/live/whoknows-gruppe2.dk/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/whoknows-gruppe2.dk/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Browseren husker at siden kun må åbnes med https
        add_header Strict-Transport-Security "max-age=31536000" always;
        include /etc/nginx/security-headers.conf;

        location / {
            proxy_pass http://backend:8080;
        }
    }
}
