# Security headers til alle svar (Harden Yourself / Mozilla Observatory).
# always: headeren sendes også ved fejlsider.

# Siden må kun hente scripts, CSS, billeder osv. fra sig selv, og den må ikke vises i en iframe
add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# Gamle browsere: må ikke vises i en iframe (clickjacking)
add_header X-Frame-Options "DENY" always;
# Browseren må ikke gætte en anden filtype end den, serveren siger
add_header X-Content-Type-Options "nosniff" always;
# Andre sider får kun vores domæne at vide, ikke hele adressen med søgningen
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
