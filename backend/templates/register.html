{{ template "header" . }}
  <h2>Sign Up</h2>
  {{ if .Error }}<div class="error" role="alert"><strong>Error:</strong> {{ .Error }}</div>{{ end }}
  <form action="/api/register" method="POST">
    <dl>
      <dt><label for="username">Username:</label>
      <dd><input type="text" id="username" name="username" size="30" value="{{ .FormUsername }}" autocomplete="username" required>
      <dt><label for="email">E-Mail:</label>
      <dd><input type="email" id="email" name="email" size="30" value="{{ .FormEmail }}" autocomplete="email" required>
      <dt><label for="password">Password:</label>
      <dd><input type="password" id="password" name="password" size="30" autocomplete="new-password" required>
    </dl>
    <div class="actions">
      <button type="submit" id="register-button">Sign Up</button>
    </div>
  </form>
{{ template "footer" . }}
