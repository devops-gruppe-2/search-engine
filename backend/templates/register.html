{{ template "header" . }}
  <h2>Sign Up</h2>
  {{ if .Error }}<div class="error"><strong>Error:</strong> {{ .Error }}</div>{{ end }}
  <form action="/api/register" method="POST">
    <dl>
      <dt>Username:
      <dd><input type="text" name="username" size="30" value="{{ .FormUsername }}">
      <dt>E-Mail:
      <dd><input type="text" name="email" size="30" value="{{ .FormEmail }}">
      <dt>Password:
      <dd><input type="password" name="password" size="30">
    </dl>
    <div class="actions">
      <button type="submit" id="register-button">Sign Up</button>
    </div>
  </form>
{{ template "footer" . }}
