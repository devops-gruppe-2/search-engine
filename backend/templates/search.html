{{ template "header" . }}
<div>
  <form action="/" method="GET">
    <input id="search-input" name="q" placeholder="Search..." value="{{ .Query }}" autofocus />
    <button id="search-button" type="submit">Search</button>
  </form>
</div>

{{ if .Error }}
<div class="error">{{ .Error }}</div>
{{ end }}

<div id="results">
  {{ range .SearchResults }}
  <div>
      <h2><a class="search-result-title" href="{{ .URL }}">{{ .Title }}</a></h2>
      <p class="search-result-description">{{ printf "%.300s" .Content }}…</p>
  </div>
  {{ end }}
</div>
{{ template "footer" . }}
