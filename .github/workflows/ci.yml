name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# CI skal kun læse koden (GitHub Actions security hardening: mindst mulige rettigheder)
permissions:
  contents: read

jobs:
  # Static analysis af Go-koden (backend/.golangci.yml) og af Dockerfilen
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: backend

      - name: Lint Dockerfile with Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: backend/Dockerfile

  # Go-tests: unit tests af password-funktionerne og integrationstests mod hele appen
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Run tests
        working-directory: backend
        run: go test -v ./...

  # End-to-end tests med Playwright: en rigtig browser bruger siden som en bruger ville.
  # Kører kun hvis lint og test er grønne.
  e2e:
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start application
        run: docker compose up --build -d

      - name: Wait for application
        run: |
          for i in {1..30}; do
            curl --fail --silent http://localhost:8080/ > /dev/null && exit 0
            echo "Waiting for application..."
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: e2e
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: Stop application
        if: always()
        run: docker compose down

  # Scanner Docker-imagerne for kendte sårbarheder med Trivy (Harden Yourself).
  # Fejler ved HIGH eller CRITICAL, som der findes en rettelse til.
  # Trivy køres fra sit Docker-image, låst til et digest, i stedet for trivy-action.
  trivy:
    runs-on: ubuntu-latest
    needs: [lint, test]
    env:
      TRIVY_IMAGE: aquasec/trivy:0.69.3@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build images
        run: |
          docker build -t whoknows-backend:scan ./backend
          docker build -t whoknows-nginx:scan ./nginx

      - name: Scan images with Trivy
        run: |
          for image in whoknows-backend:scan whoknows-nginx:scan; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE"               image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress "$image"
          done

  # Bygger appen og Docker-imaget og tjekker at det hele starter (smoke test).
  # Kører kun hvis lint og test er grønne.
  build:
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build backend
        working-directory: backend
        run: go build -o backend .

      - name: Start application
        run: docker compose up --build -d

      - name: Run smoke test
        run: |
          for i in {1..15}; do
            if curl --fail --silent http://localhost:8080/ > /dev/null; then
              ./scripts/smoke-test.sh
              exit 0
            fi

            echo "Waiting for application..."
            sleep 2
          done

          echo "Smoke test failed: application did not become ready."
          docker compose logs
          exit 1

      - name: Stop application
        if: always()
        run: docker compose down
