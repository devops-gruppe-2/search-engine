name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  # Static analysis af Go-koden (backend/.golangci.yml) og af Dockerfilen
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: backend

      - name: Lint Dockerfile with Hadolint
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: backend/Dockerfile

  # Go-tests: unit tests af password-funktionerne og integrationstests mod hele appen
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Run tests
        working-directory: backend
        run: go test -v ./...

  # End-to-end tests med Playwright: en rigtig browser bruger siden som en bruger ville.
  # Kører kun hvis lint og test er grønne.
  e2e:
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Start application
        run: docker compose up --build -d

      - name: Wait for application
        run: |
          for i in {1..30}; do
            curl --fail --silent http://localhost:8080/ > /dev/null && exit 0
            echo "Waiting for application..."
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: e2e
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: Stop application
        if: always()
        run: docker compose down

  # Bygger appen og Docker-imaget og tjekker at det hele starter (smoke test).
  # Kører kun hvis lint og test er grønne.
  build:
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build backend
        working-directory: backend
        run: go build -o backend main.go

      - name: Start application
        run: docker compose up --build -d

      - name: Run smoke test
        run: |
          for i in {1..15}; do
            if curl --fail --silent http://localhost:8080/ > /dev/null; then
              ./scripts/smoke-test.sh
              exit 0
            fi

            echo "Waiting for application..."
            sleep 2
          done

          echo "Smoke test failed: application did not become ready."
          docker compose logs
          exit 1

      - name: Stop application
        if: always()
        run: docker compose down
